<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FFE4EC">
    <title>Luna Unicorn Magic ✨</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.svg">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --pink: #FFE4EC;
            --lavender: #E8D5FF;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(180deg, var(--pink) 0%, var(--lavender) 100%);
            touch-action: manipulation;
        }

        #paintCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none;
        }

        .top-buttons {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .btn-clear {
            padding: 15px 25px;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            color: white;
            background: #FF6B6B;
            border: none;
            border-radius: 25px;
        }

        .btn-music {
            padding: 15px 25px;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            color: white;
            background: linear-gradient(135deg, #6B5B95 0%, #D4A5FF 100%);
            border: none;
            border-radius: 25px;
        }

        .btn-music.playing {
            background: linear-gradient(135deg, #FF6B9D 0%, #C44D9A 100%);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .color-palette {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            padding: 15px 20px;
            background: rgba(255,255,255,0.4);
            border-radius: 30px;
            z-index: 10;
        }

        .color-swatch {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.8);
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        .color-swatch.active {
            border: 4px solid #FFD700;
            transform: scale(1.15);
        }
    </style>
</head>
<body>
    <canvas id="paintCanvas"></canvas>
    
    <div class="top-buttons">
        <button class="btn-music" id="musicBtn">🎵 Música</button>
        <button class="btn-clear" id="clearBtn">🗑️ Limpiar</button>
    </div>

    <div class="color-palette">
        <div class="color-swatch active" data-color="#FF6B6B" style="background:#FF6B6B"></div>
        <div class="color-swatch" data-color="#FFB347" style="background:#FFB347"></div>
        <div class="color-swatch" data-color="#FFE66D" style="background:#FFE66D"></div>
        <div class="color-swatch" data-color="#4ECDC4" style="background:#4ECDC4"></div>
        <div class="color-swatch" data-color="#4A90D9" style="background:#4A90D9"></div>
        <div class="color-swatch" data-color="#FF69B4" style="background:#FF69B4"></div>
        <div class="color-swatch" data-color="#D4A5FF" style="background:#D4A5FF"></div>
        <div class="color-swatch" data-color="#FFFFFF" style="background:#FFFFFF"></div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentColor = '#FF6B6B';
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let audioCtx = null;
        let musicInterval = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
            ctx.beginPath();
            ctx.arc(lastX, lastY, 12, 0, Math.PI * 2);
            ctx.fillStyle = currentColor;
            ctx.fill();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = 25;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function selectColor(e) {
            if (e.target.classList.contains('color-swatch')) {
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                e.target.classList.add('active');
                currentColor = e.target.dataset.color;
                playClickSound();
            }
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            playClearSound();
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playClickSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(523, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playClearSound() {
            initAudio();
            const notes = [523, 659, 784];
            notes.forEach((freq, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }, i * 100);
            });
        }

        function toggleMusic() {
            const btn = document.getElementById('musicBtn');
            if (musicInterval) {
                clearInterval(musicInterval);
                musicInterval = null;
                btn.textContent = '🎵 Música';
                btn.classList.remove('playing');
            } else {
                initAudio();
                const melody = [392, 440, 494, 523, 587, 659, 784, 659, 587, 523, 494, 440];
                let i = 0;
                musicInterval = setInterval(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(melody[i], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.6);
                    i = (i + 1) % melody.length;
                }, 500);
                btn.textContent = '⏸️ Música';
                btn.classList.add('playing');
            }
        }

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        document.querySelector('.color-palette').addEventListener('click', selectColor);
        document.querySelector('.color-palette').addEventListener('touchstart', selectColor, { passive: true });
        
        document.getElementById('clearBtn').addEventListener('click', clearCanvas);
        document.getElementById('clearBtn').addEventListener('touchstart', clearCanvas, { passive: true });
        
        document.getElementById('musicBtn').addEventListener('click', toggleMusic);
        document.getElementById('musicBtn').addEventListener('touchstart', toggleMusic, { passive: true });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
</html>
